<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles.css">

    <title>QR - Radar de Obra</title>

    <!-- Librería para generar códigos QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</head>

<body>

    <div class="contenedor">

        <h1>
            <img src="./img/LogoRadarDeObra.png" alt="Logo Radar de Obra" height="55px" width="310px">
        </h1>

        <p>
            Escaneá el código QR para acceder
            al proyecto y conocer más sobre Radar de Obra.
        </p>

        <div id="qrcode"></div>

        <a
            class="boton"
            href="https://github.com/julian-agustin-gonzalez/RadarDeObra"
            target="_blank">
            Ver proyecto
        </a>

        <div class="pie">
            Proyecto Integrador — Expo Técnica
        </div>

    </div>

    <script src="./js/script.js"></script>

</body>
</html>
